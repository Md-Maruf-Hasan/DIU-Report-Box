name: diu_report_box
description: "DIU Report Box - University Reporting and Student Utility Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4

  # Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.0.1
  cloud_functions: ^5.0.1
  supabase_flutter: ^2.8.0

  # File & Media Handlers
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.0.5
  url_launcher: ^6.3.0
  open_filex: ^4.5.0

  # Utilities & Formatting
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
